name: Daily Data Collection

on:
  schedule:
    # KST 자정 = UTC 15:00
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.MOGAKJAK_SSH_HOST }}
      SSH_USER: ${{ secrets.MOGAKJAK_SSH_USER }}
      TUNNEL_LOCAL_PORT: "13308"
      TUNNEL_REMOTE_PORT: "3308"
      MOGAKJAK_DB_HOST: 127.0.0.1
      MOGAKJAK_DB_PORT: "13308"
      MOGAKJAK_DB_NAME: ${{ secrets.MOGAKJAK_DB_NAME }}
      MOGAKJAK_DB_USER: ${{ secrets.MOGAKJAK_DB_USER }}
      MOGAKJAK_DB_PASSWORD: ${{ secrets.MOGAKJAK_DB_PASSWORD }}
      MOGAKJAK_DB_TYPE: mysql
      OUTPUT_DIR: ./data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MOGAKJAK_SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          missing=()
          test -n "${{ secrets.MOGAKJAK_SSH_HOST }}" || missing+=("MOGAKJAK_SSH_HOST")
          test -n "${{ secrets.MOGAKJAK_SSH_USER }}" || missing+=("MOGAKJAK_SSH_USER")
          test -n "${SSH_PRIVATE_KEY}" || missing+=("MOGAKJAK_SSH_PRIVATE_KEY")
          test -n "${{ secrets.MOGAKJAK_DB_NAME }}" || missing+=("MOGAKJAK_DB_NAME")
          test -n "${{ secrets.MOGAKJAK_DB_USER }}" || missing+=("MOGAKJAK_DB_USER")
          test -n "${{ secrets.MOGAKJAK_DB_PASSWORD }}" || missing+=("MOGAKJAK_DB_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            echo "Register at: https://github.com/mogakjak/mogakjak-data/settings/secrets/actions"
            echo "See docs/GITHUB_ACTIONS_설정.md"
            exit 1
          fi
          echo "Required secrets present"

      - name: Start SSH tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MOGAKJAK_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/mogakjak.key
          chmod 600 ~/.ssh/mogakjak.key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/mogakjak.key \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -N -L "${TUNNEL_LOCAL_PORT}:127.0.0.1:${TUNNEL_REMOTE_PORT}" \
            "${SSH_USER}@${SSH_HOST}" &
          echo $! > /tmp/ssh_tunnel.pid
          for i in $(seq 1 30); do
            if python -c "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1', int('${TUNNEL_LOCAL_PORT}'))); s.close()"; then
              echo "SSH tunnel ready on port ${TUNNEL_LOCAL_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "SSH tunnel failed to start"
          exit 1

      - name: Test DB connection
        run: |
          set -o pipefail
          python test_connection.py | tee /tmp/db_test.log

      - name: Run daily collection
        run: python main.py

      - name: Run GA collection (optional)
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ga-service-account.json
        run: |
          set -euo pipefail
          if [ -z "${GA4_PROPERTY_ID:-}" ] || [ -z "${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "GA secrets not set — skip GA collection (DB only)"
            exit 0
          fi
          printf '%s' "${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}" > /tmp/ga-service-account.json
          python - <<'PY'
          from main import get_target_date
          from collectors.ga_metrics import collect_ga_metrics

          target = get_target_date()
          print(f"GA 수집: {target}")
          payload = collect_ga_metrics(target)
          print(f"GA status: {payload.get('status')}")
          PY

      - name: Refresh dashboard catalog/manifest
        run: |
          python dashboard/build_manifest.py
          python dashboard/build_catalog.py

      - name: Commit and push collected data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/manifest.json dashboard/metrics_catalog.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          TARGET_DATE=$(python -c "from main import get_target_date; print(get_target_date())")
          git commit -m "data: daily snapshot ${TARGET_DATE}"
          git push

      - name: Stop SSH tunnel
        if: always()
        run: |
          if [ -f /tmp/ssh_tunnel.pid ]; then
            kill "$(cat /tmp/ssh_tunnel.pid)" || true
          fi

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mogakjak-daily-${{ github.run_id }}
          path: data/
          retention-days: 90
          if-no-files-found: ignore

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skip"
            exit 0
          fi
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="failure"
          fi
          MSG=""
          if [ "$STATUS" = "failure" ]; then
            if [ -f /tmp/db_test.log ]; then
              MSG=$(python - <<'PY'
from pathlib import Path
text = Path("/tmp/db_test.log").read_text(encoding="utf-8", errors="replace")
# Keep the useful tail, drop huge SQLAlchemy stack if present
lines = [ln for ln in text.splitlines() if ln.strip()]
useful = [ln for ln in lines if ln.startswith(("실패:", "원인:", "  host=", "  port=", "  name=", "  user=", "  password_"))]
if not useful:
    useful = lines[-8:]
print("\n".join(useful)[:900])
PY
)
            else:
              MSG="수집 실패. Actions 로그에서 빨간 단계를 확인하세요."
          fi
          python scripts/notify_discord.py \
            --status "$STATUS" \
            --message "$MSG" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
